<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Modern Office Tower</title>
  <desc id="desc">Illustrated modern office tower in an urban skyline</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94c5ff"/>
      <stop offset="1" stop-color="#d7ecff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bde1ff"/>
      <stop offset="1" stop-color="#4b8bc2"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb790"/>
      <stop offset="1" stop-color="#7d6a4d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.76">
    <ellipse cx="170" cy="124" rx="86" ry="30"/>
    <ellipse cx="258" cy="130" rx="72" ry="24"/>
    <ellipse cx="896" cy="118" rx="94" ry="35"/>
